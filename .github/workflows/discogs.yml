name: Scrape Discogs

on:
  push:
    branches:
      - main
    paths:
      - "packages/discogs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @my-vinyls/discogs build

      - name: Scrape Discogs
        # also refreshes packages/discogs/fx-rates.json with any newly resolved rates
        run: node packages/discogs/dist/index.js --out list.json
        env:
          DISCOGS_USERNAME: "kyle-seongwoo-jun"
          DISCOGS_API_KEY: ${{ secrets.DISCOGS_API_KEY }}

      - name: Get current date
        id: date
        run: |
          echo "CURRENT_DATE=$(date +'%b %d, %Y')" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "feat: update list.json on ${{ steps.date.outputs.CURRENT_DATE }}"
          commit-message: "feat: update list.json on ${{ steps.date.outputs.CURRENT_DATE }}"
          branch: scrape-discogs
          add-paths: |
            list.json
            packages/discogs/fx-rates.json
